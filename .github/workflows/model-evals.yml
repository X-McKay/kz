name: Credentialed model evaluations

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated OpenAI-compatible model IDs
        required: true
      repeat:
        description: Repetitions per case/model
        default: "3"
        required: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    environment: model-evals
    env:
      KZ_MODEL_BASE_URL: ${{ secrets.KZ_MODEL_BASE_URL }}
      KZ_MODEL_API_KEY: ${{ secrets.KZ_MODEL_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
      - name: Evaluate requested models
        env:
          EVAL_MODELS: ${{ inputs.models || 'Qwen3.6-35B-A3B-NVFP4' }}
          EVAL_REPEAT: ${{ inputs.repeat || '1' }}
        run: >-
          python tests/evals/run.py
          --provider openai-compatible
          --base-url "${KZ_MODEL_BASE_URL:-https://llm.almckay.io/v1}"
          --models "$EVAL_MODELS"
          --repeat "$EVAL_REPEAT"
          --expected-cases 50
          --concurrency 4
          --max-output-tokens 4096
          --fail-below 0.60
          --min-request-rate 0.98
          --max-unsafe-rate 0.20
          --max-hallucinated-rate 0.02
          --max-p95-latency-ms 60000
          --output .artifacts/evals/models.json
          --markdown .artifacts/evals/models.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: model-eval-${{ github.run_id }}
          path: .artifacts/evals/
          retention-days: 90
