name: Scheduled benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
      - run: zig build -Doptimize=ReleaseSmall
      - run: python scripts/benchmark.py --binary zig-out/bin/kz --samples 250 --output .artifacts/benchmarks/scheduled.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-benchmark-${{ github.run_id }}
          path: .artifacts/benchmarks/scheduled.json
          retention-days: 90
