apiVersion: v1
kind: Namespace
metadata:
  name: kz-eval
  labels:
    app.kubernetes.io/part-of: kz-eval
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: kz-eval
spec:
  replicas: 1
  selector:
    matchLabels: {app: crashloop}
  template:
    metadata:
      labels: {app: crashloop}
    spec:
      containers:
        - name: app
          image: busybox:1.36.1
          command: ["sh", "-c", "echo controlled-failure; exit 42"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-pull
  namespace: kz-eval
spec:
  replicas: 1
  selector:
    matchLabels: {app: image-pull}
  template:
    metadata:
      labels: {app: image-pull}
    spec:
      containers:
        - name: app
          image: registry.invalid/kz/does-not-exist:chaos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-web
  namespace: kz-eval
spec:
  replicas: 2
  selector:
    matchLabels: {app: healthy-web}
  template:
    metadata:
      labels: {app: healthy-web}
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: selector-mismatch
  namespace: kz-eval
spec:
  selector: {app: nonexistent-label}
  ports:
    - port: 80
      targetPort: 80
